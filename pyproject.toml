[project]
name = "tremula-mcp"
version = "0.1.0"
description = "Code-memory MCP for Claude Code: an Obsidian-compatible note graph about a codebase, auto-maintained via hooks."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Firsak" }]
keywords = ["mcp", "claude", "memory", "obsidian", "knowledge-graph"]
dependencies = [
    "mcp>=1.2.0",
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[project.scripts]
tremula = "tremula.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tremula"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["fixtures"]
markers = [
    "live: opt-in tests that call a real LLM (skipped unless TREMULA_LIVE_TESTS=1)",
]
addopts = "-m 'not live'"
